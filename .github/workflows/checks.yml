# Runs the full project gate (make check) on every pull request.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies and test browsers
        run: make setup
      - name: Install system libraries for Chromium and WebKit
        run: cd web && npx playwright install-deps chromium webkit
      - name: Run every check
        run: make check
