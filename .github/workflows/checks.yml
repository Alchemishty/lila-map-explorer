# Runs the full project gate (make check) on every pull request.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies and test browsers
        run: make setup
      - name: Install system libraries for Chromium and WebKit
        run: cd web && npx playwright install-deps chromium webkit
      - name: Run every check
        run: make check
