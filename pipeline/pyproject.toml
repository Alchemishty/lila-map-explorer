[project]
name = "lila-pipeline"
version = "0.1.0"
description = "Build step that cleans and validates LILA telemetry and writes static files"
requires-python = ">=3.12"
dependencies = ["pyarrow", "pandas", "pillow"]

[dependency-groups]
dev = ["pytest", "mypy", "ruff", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lila_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src:tests"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
